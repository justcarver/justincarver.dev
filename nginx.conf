server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options nosniff always;

    location = /index.md {
        types { }
        default_type text/markdown;
        charset_types text/markdown;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
